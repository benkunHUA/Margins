[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "margins-backend"
version = "0.1.0"
description = "Margins 知识库系统后端（FastAPI + LangChain 1.x + Faiss + MinerU + 百炼）"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "aiofiles>=24.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "anyio>=4.6",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-community>=0.3",
  "langchain-text-splitters>=1.0,<2",
  "faiss-cpu>=1.9",
  "dashscope>=1.20",
  "mineru-open-sdk>=0.2",
  "pypdf>=5",
  "cryptography>=42,<45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: 需要真实 API key 的冒烟测试（默认跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：FastAPI 依赖注入（Depends/File 作为默认参数）属标准用法
ignore = ["B008"]
